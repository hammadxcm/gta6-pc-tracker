<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Porting Race Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#fff; --soft:rgba(255,255,255,.72); --dim:rgba(255,255,255,.5);
  --pink:#ff8fc4; --hot:#ff4f9a; --cyan:#62e6ff; --lav:#d9d0ff; --lavInk:#3b2a6b;
  --glass:rgba(22,14,40,.62); --glass2:rgba(255,255,255,.07); --line:rgba(255,255,255,.1);
  --merged:#a78bfa; --closed:#ff6b7a; --opened:#d9d0ff;
  --disp:"Barlow Condensed",Impact,sans-serif; --body:"Plus Jakarta Sans",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#120a22;overflow:hidden;color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
.mono{font-family:"JetBrains Mono",monospace}
#stage{position:absolute;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden}

/* ---------------- background: original neon-dusk city ---------------- */
#bg{position:absolute;inset:0;overflow:hidden}
#bg .sky{position:absolute;inset:0;background:linear-gradient(180deg,#1b1238 0%,#3a2263 30%,#7a3f86 55%,#d9759a 74%,#ffb38a 86%)}
#bg .custom{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1s}
#bg .sun{position:absolute;left:820px;top:360px;width:440px;height:440px;border-radius:50%;
  background:linear-gradient(180deg,#ffe58a 0%,#ff9f6e 45%,#ff4f9a 100%);
  -webkit-mask:repeating-linear-gradient(180deg,#000 0 26px,transparent 26px 34px);mask:linear-gradient(#000 45%,transparent 45%),repeating-linear-gradient(180deg,#000 0 22px,transparent 22px 30px);
  box-shadow:0 0 160px 40px rgba(255,120,150,.35);animation:sunbob 14s ease-in-out infinite alternate}
@keyframes sunbob{to{transform:translateY(18px)}}
#bg svg{position:absolute;left:0;bottom:0;width:100%;height:100%}
#bg .floor{position:absolute;left:-50%;right:-50%;bottom:-120px;height:360px;transform:perspective(420px) rotateX(62deg);transform-origin:bottom;
  background-image:linear-gradient(rgba(255,120,200,.55) 2px,transparent 2px),linear-gradient(90deg,rgba(255,120,200,.55) 2px,transparent 2px);
  background-size:80px 80px;animation:floor 3s linear infinite;mask-image:linear-gradient(transparent,#000 40%)}
@keyframes floor{to{background-position:0 80px}}
#bg .shade{position:absolute;inset:0;background:
  linear-gradient(90deg,rgba(18,8,36,.93) 0%,rgba(18,8,36,.78) 38%,rgba(18,8,36,.25) 62%,rgba(18,8,36,.55) 100%),
  linear-gradient(180deg,rgba(18,8,36,.55),transparent 30%,transparent 70%,rgba(18,8,36,.9))}
.win{animation:twinkle var(--t,6s) ease-in-out infinite}
@keyframes twinkle{50%{opacity:.15}}
.palm{transform-origin:bottom center;animation:sway var(--s,7s) ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-1.6deg)}to{transform:rotate(1.8deg)}}
.dust{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:0;animation:dust linear infinite}
@keyframes dust{10%{opacity:.7}90%{opacity:.3}to{transform:translate(var(--dx),-700px);opacity:0}}

/* ---------------- header ---------------- */
header{position:absolute;left:88px;top:52px;right:60px;display:flex;align-items:center;z-index:3}
.brand{font-family:var(--disp);font-weight:800;font-size:104px;line-height:.8;letter-spacing:-.01em;display:flex;gap:26px;white-space:nowrap}
.brand span{color:rgba(255,255,255,.62);transition:color .6s,text-shadow .6s}
.brand span.on{color:#fff;text-shadow:0 0 30px rgba(255,255,255,.35)}
.repos{display:flex;margin-left:30px;max-width:780px}
.repo{border-left:2px solid rgba(255,255,255,.35);padding:4px 22px;transition:opacity .6s}
.repo b{display:block;font-size:22px;font-weight:700;letter-spacing:-.01em}
.repo i{display:block;font-style:normal;font-size:17px;color:var(--dim);margin-top:6px;max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.repo.dimmed{opacity:.55}
.checked{margin-left:auto;align-self:flex-start;background:rgba(10,6,20,.78);border:1px solid var(--line);border-radius:999px;padding:14px 26px;display:flex;align-items:center;gap:14px;font-size:19px;color:var(--soft);font-weight:600}
.checked .dot{width:11px;height:11px;border-radius:50%;background:#7a6a9a;transition:background .3s}
.checked .dot.ping{background:#5cff9d;box-shadow:0 0 0 0 rgba(92,255,157,.7);animation:ping 1.2s ease-out}
@keyframes ping{to{box-shadow:0 0 0 14px rgba(92,255,157,0)}}
.checked b{color:#fff;font-weight:800;font-variant-numeric:tabular-nums}
.live{background:#ff2d55;color:#fff;font-weight:800;font-size:15px;letter-spacing:.14em;padding:5px 10px;border-radius:6px;margin-right:2px;animation:blink 2s infinite}
@keyframes blink{50%{opacity:.6}}
.headline{position:absolute;left:88px;top:168px;z-index:3;font-size:36px;font-weight:800;color:var(--pink);letter-spacing:-.01em;height:46px;white-space:nowrap;text-shadow:0 2px 24px rgba(255,79,154,.35)}
.headline .caret{display:inline-block;width:3px;height:34px;background:var(--pink);margin-left:4px;vertical-align:-5px;animation:caret 1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}

/* ---------------- scene area ---------------- */
#scenes{position:absolute;left:88px;top:244px;width:1180px;height:628px;z-index:2}
.scene{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .7s}
.scene.on{opacity:1}
.scene-dots{position:absolute;left:88px;top:892px;display:flex;gap:10px;z-index:3}
.scene-dots div{width:46px;height:5px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
.scene-dots div i{display:block;height:100%;width:0;background:#fff}

/* spotlight */
#spot{display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:30px}
.sp-top{display:flex;align-items:center;gap:20px}
.pill{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;font-weight:700;background:var(--opened);color:var(--lavInk);white-space:nowrap}
.pill.merged{background:var(--merged);color:#1c1040}
.pill.closed{background:var(--closed);color:#3a0710}
.pill.draft{background:#bfb8d0;color:#2b2540}
.sp-top .pill{font-size:26px;padding:12px 30px}
.sp-top .rp{font-family:var(--disp);font-weight:800;font-size:38px;letter-spacing:.01em}
.sp-num{font-family:var(--disp);font-weight:900;font-size:232px;line-height:.82;letter-spacing:-.02em;margin-top:26px;font-variant-numeric:tabular-nums;text-shadow:0 10px 60px rgba(0,0,0,.35)}
.sp-title{font-size:56px;font-weight:800;line-height:1.08;letter-spacing:-.02em;margin-top:24px;max-width:1120px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 4px 30px rgba(0,0,0,.4)}
.sp-by{display:flex;align-items:center;gap:16px;margin-top:30px;font-size:30px;font-weight:700}
.sp-by img{width:56px;height:56px;border-radius:50%;border:3px solid rgba(255,255,255,.85);background:#333}
.sp-by span{color:var(--dim);font-weight:600}
.sp-diff{margin-top:16px;font-size:23px;font-weight:600;color:var(--soft);display:flex;gap:20px;align-items:center}
.sp-diff .add{color:#6ef0a0}.sp-diff .del{color:#ff7a8a}
.sp-diff .bar{display:flex;gap:3px}.sp-diff .bar i{width:13px;height:13px;border-radius:3px;background:rgba(255,255,255,.18)}
.sp-diff .bar i.a{background:#6ef0a0}.sp-diff .bar i.d{background:#ff7a8a}
.anim{opacity:0;transform:translateY(40px);filter:blur(8px)}
.show .anim{opacity:1;transform:none;filter:none;transition:opacity .7s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1),filter .7s}
.hide .anim{opacity:0;transform:translateY(-30px);filter:blur(6px);transition:all .45s ease-in}
.show .d1{transition-delay:.05s!important}.show .d2{transition-delay:.15s!important}.show .d3{transition-delay:.28s!important}.show .d4{transition-delay:.4s!important}.show .d5{transition-delay:.5s!important}
.sp-meter{position:absolute;left:0;bottom:0;width:420px;height:3px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden}
.sp-meter i{display:block;height:100%;width:0;background:var(--pink)}
.breaking{position:absolute;left:0;top:30px;font-family:var(--disp);font-size:30px;font-weight:800;letter-spacing:.12em;background:#ff2d55;padding:4px 16px;border-radius:6px;opacity:0;transform:translateX(-30px)}
.breaking.go{animation:brk 4s ease forwards}
@keyframes brk{10%,85%{opacity:1;transform:none}100%{opacity:0}}

/* head-to-head */
#h2h{display:grid;grid-template-columns:1fr 1fr;gap:28px;padding-top:20px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:28px;padding:30px 32px;backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:20px}
.card h3{font-family:var(--disp);font-size:58px;font-weight:800;line-height:.9;display:flex;align-items:baseline;gap:14px}
.card h3 small{font-family:var(--body);font-size:16px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.08em}
.donutrow{display:flex;align-items:center;gap:26px}
.donut{position:relative;width:170px;height:170px;flex:none}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:15}
.donut .tr{stroke:rgba(255,255,255,.1)}
.donut .pg{stroke:var(--acc);stroke-linecap:round;stroke-dasharray:452.4;stroke-dashoffset:452.4;transition:stroke-dashoffset 2.4s cubic-bezier(.2,.8,.2,1)}
.donut .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.donut .c b{font-family:var(--disp);font-size:52px;font-weight:800;line-height:1}
.donut .c span{display:block;font-size:12px;letter-spacing:.12em;color:var(--dim);font-weight:700;text-transform:uppercase}
.dl{font-size:18px;color:var(--soft);line-height:1.5}.dl b{color:#fff;font-size:26px;font-family:var(--disp);font-weight:800;letter-spacing:.02em}
.meas{display:flex;flex-direction:column;gap:14px}
.meas .row{display:flex;justify-content:space-between;font-size:18px;font-weight:700;margin-bottom:7px}
.meas .row span{color:var(--dim);font-weight:600;font-size:16px}
.meas .tk{height:11px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}
.meas .fl{height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 50%,#fff0),var(--acc));transition:width 2.2s cubic-bezier(.2,.8,.2,1)}
.stage-list{display:flex;flex-wrap:wrap;gap:8px}
.stage-list span{font-size:14px;font-weight:700;padding:6px 12px;border-radius:999px;background:var(--glass2);display:flex;gap:6px;align-items:center}
.stage-list span::before{content:"";width:9px;height:9px;border-radius:50%;background:#6ef0a0}
.stage-list span.p::before{background:#ffc04d}

/* activity */
#act{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;padding-top:20px}
.chart{position:relative;height:300px;display:flex;align-items:flex-end;gap:5px;margin-top:20px}
.chart .h{flex:1;display:flex;gap:2px;align-items:flex-end;height:100%}
.chart .h i{flex:1;border-radius:4px 4px 1px 1px;height:0;transition:height 1.4s cubic-bezier(.2,.8,.2,1)}
.axis{display:flex;justify-content:space-between;color:var(--dim);font-size:14px;margin-top:10px;font-weight:600}
.leg{display:flex;gap:22px;font-size:17px;font-weight:700}.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px}
.lb{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.lb .r{display:flex;align-items:center;gap:14px;font-size:20px;font-weight:700;opacity:0;transform:translateX(-30px)}
.scene.on .lb .r{opacity:1;transform:none;transition:all .6s cubic-bezier(.2,.8,.2,1)}
.lb img{width:40px;height:40px;border-radius:50%;background:#333}
.lb .rk{font-family:var(--disp);font-size:28px;width:26px;color:var(--dim)}
.lb .n{margin-left:auto;font-family:var(--disp);font-size:30px}
.lb .tag{font-size:12px;padding:3px 8px;border-radius:6px;color:#111;font-weight:800}
.sub{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:800}

/* ---------------- latest panel ---------------- */
#latest{position:absolute;left:1328px;top:214px;width:568px;height:680px;z-index:3;background:rgba(14,9,26,.8);border:1px solid var(--line);border-radius:30px;padding:34px 34px 20px;backdrop-filter:blur(14px);overflow:hidden}
#latest h4{font-family:var(--disp);font-weight:800;font-size:44px;letter-spacing:.01em;line-height:1;margin-bottom:14px;display:flex;align-items:center;gap:12px}
#latest h4 small{font-family:var(--body);font-size:14px;color:var(--dim);font-weight:700;letter-spacing:.1em;margin-left:auto}
.ev{display:grid;grid-template-columns:116px 1fr;gap:18px;padding:12px 0;border-bottom:1px solid var(--line);position:relative;transition:background .4s}
.ev:last-child{border-bottom:0}
.ev .pill{font-size:15px;padding:6px 0;height:30px;margin-top:2px}
.ev p{font-size:19px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ev s{text-decoration:none;display:flex;align-items:center;gap:10px;margin-top:7px;font-size:15.5px;color:var(--dim);font-weight:600}
.badge{font-family:var(--disp);font-size:17px;font-weight:800;padding:2px 10px;border-radius:7px;color:#0d0d0d;letter-spacing:.02em}
.ev.cur::before{content:"";position:absolute;left:-34px;top:12px;bottom:12px;width:5px;border-radius:0 4px 4px 0;background:var(--pink);box-shadow:0 0 14px var(--pink)}
.ev.enter{animation:evin .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes evin{from{opacity:0;transform:translateY(-40px)}}
.ev.fresh{background:linear-gradient(90deg,rgba(255,143,196,.16),transparent);border-radius:12px}

/* ---------------- bottom stat strip ---------------- */
#strip{position:absolute;left:88px;right:24px;top:922px;height:132px;display:grid;grid-template-columns:repeat(5,1fr);gap:24px;z-index:3;perspective:900px}
.tile{position:relative;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.5,0,.2,1)}
.tile.flip{transform:rotateX(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:rgba(14,9,26,.82);border:1px solid var(--line);border-radius:24px;padding:20px 30px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.face.back{transform:rotateX(180deg)}
.face b{font-family:var(--disp);font-weight:800;font-size:66px;line-height:.95;letter-spacing:-.005em;font-variant-numeric:tabular-nums;white-space:nowrap}
.face span{font-size:19px;color:var(--soft);font-weight:600;margin-top:8px;display:flex;align-items:center;gap:10px}
.face .badge{font-size:14px;padding:1px 7px}
.face::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--acc)}

/* ---------- slideshow / loading-screen engine ---------- */
#slides{position:absolute;inset:0;overflow:hidden}
.sl{position:absolute;inset:-4%;background-size:cover;background-position:center;will-change:transform,clip-path}
.sl.in{animation:wipein 1.25s cubic-bezier(.77,0,.18,1) forwards, kb var(--kbd,22s) linear forwards}
.sl.out{animation:wipeout 1.25s cubic-bezier(.77,0,.18,1) forwards}
@keyframes wipein{from{clip-path:polygon(115% 0,135% 0,115% 100%,95% 100%)}to{clip-path:polygon(-20% 0,135% 0,115% 100%,-40% 100%)}}
@keyframes wipeout{to{transform:translateX(-6%) scale(1.04);filter:brightness(.5)}}
@keyframes kb{from{transform:scale(1.14) translate(var(--kx0,2%),var(--ky0,1%))}to{transform:scale(1.0) translate(var(--kx1,-2%),var(--ky1,-1%))}}
.grade{position:absolute;inset:0;opacity:0;transition:opacity 1s;mix-blend-mode:soft-light;
  background:linear-gradient(160deg,rgba(124,77,255,.75),rgba(255,79,154,.55) 55%,rgba(255,184,107,.5))}
.has-slides .grade{opacity:1}
.has-slides #city,.has-slides .sun,.has-slides .floor{opacity:0;transition:opacity 1.2s}
.has-slides .shade{background:linear-gradient(90deg,rgba(18,8,36,.92) 0%,rgba(18,8,36,.72) 40%,rgba(18,8,36,.35) 64%,rgba(18,8,36,.6) 100%),
  linear-gradient(180deg,rgba(18,8,36,.7),transparent 26%,transparent 66%,rgba(18,8,36,.95))}
.grain{position:absolute;inset:-50%;opacity:.07;pointer-events:none;animation:grain .6s steps(4) infinite;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}}
#stinger{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:hidden}
#stinger i{position:absolute;top:-20%;bottom:-20%;width:42%;left:-60%;transform:skewX(-18deg)}
#stinger i:nth-child(1){background:#ff4f9a}#stinger i:nth-child(2){background:#7c4dff}#stinger i:nth-child(3){background:#120a22}
#stinger.go i{animation:sting .95s cubic-bezier(.7,0,.3,1) forwards}
#stinger.go i:nth-child(2){animation-delay:.07s}#stinger.go i:nth-child(3){animation-delay:.14s}
@keyframes sting{0%{left:-60%}100%{left:130%}}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;border-right-color:var(--pink);animation:spin .9s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
#tips{position:absolute;left:400px;top:880px;width:880px;height:30px;z-index:3;display:flex;align-items:center;gap:14px}
#tips .spin{width:22px;height:22px}
#tips .tl{font-family:var(--disp);font-weight:800;font-size:20px;letter-spacing:.14em;color:#fff}
#tiptxt{font-size:17px;font-weight:600;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .4s,transform .4s}
#tiptxt.swap{opacity:0;transform:translateY(8px)}
#tiptxt b{color:var(--pink);font-weight:800;margin-right:6px}
#slidecredit{position:absolute;right:30px;top:1059px;z-index:3;font-size:11.5px;color:rgba(255,255,255,.45);font-weight:600;max-width:160px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* now playing */
#np{position:absolute;left:1340px;top:896px;z-index:4;display:none;align-items:center;gap:10px;max-width:400px;opacity:.92}
#np.on{display:flex;animation:npin .8s cubic-bezier(.2,.8,.2,1)}
@keyframes npin{from{opacity:0;transform:translateY(8px)}}
#np .eq{display:flex;gap:2px;align-items:flex-end;height:14px}
#np .eq i{width:3px;background:var(--pink);border-radius:1px;animation:eq 1s ease-in-out infinite}
#np .eq i:nth-child(2){animation-delay:-.3s}#np .eq i:nth-child(3){animation-delay:-.6s}#np .eq i:nth-child(4){animation-delay:-.8s}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}
.np-t{display:flex;gap:6px;align-items:baseline;font-size:11.5px;color:rgba(255,255,255,.55);white-space:nowrap;overflow:hidden}
.np-t small{font-weight:800;letter-spacing:.1em;color:var(--pink);font-size:10.5px}
.np-t b{color:#fff;font-weight:700;flex:none;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.np-t span{overflow:hidden;text-overflow:ellipsis}

/* boot / loading screen */
.boot{display:block!important;background:#0c0618;overflow:hidden}
.boot-img{position:absolute;inset:-5%;background-size:cover;background-position:center;animation:kb 12s linear forwards;opacity:.9}
.boot-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(12,6,24,.95),rgba(12,6,24,.4) 60%,rgba(12,6,24,.7)),linear-gradient(180deg,transparent 60%,rgba(12,6,24,.95))}
.boot-brand{position:absolute;left:110px;top:300px;font-family:var(--disp);font-weight:900;font-size:190px;line-height:.82;letter-spacing:-.01em;
  background:linear-gradient(180deg,#fff 30%,#ff8fc4);-webkit-background-clip:text;background-clip:text;color:transparent;animation:bootin 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes bootin{from{opacity:0;transform:translateX(-60px)}}
.boot-bar{position:absolute;left:110px;right:110px;bottom:110px;height:6px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
.boot-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7c4dff,#ff4f9a,#ffb86b);transition:width .6s ease}
.boot-load{position:absolute;right:110px;bottom:140px;display:flex;align-items:center;gap:16px;font-family:var(--disp);font-size:30px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}

/* port race (portwatch) */
#race{padding-top:8px;display:flex;flex-direction:column;gap:14px}
.race-top{display:flex;align-items:flex-end;gap:34px}
.race-q{font-size:20px;font-weight:800;color:var(--pink);letter-spacing:.02em}
.race-big{font-family:var(--disp);font-weight:900;font-size:136px;line-height:.8;letter-spacing:-.02em}
.race-big small{font-size:54px;color:var(--dim);font-weight:800}
.race-side{padding-bottom:10px;display:flex;flex-direction:column;gap:8px;font-size:20px;color:var(--soft);font-weight:600}
.race-side b{color:#fff;font-family:var(--disp);font-size:30px;font-weight:800;letter-spacing:.01em}
.ladder{position:relative;height:112px;margin:2px 6px 0}
.ladder .rail{position:absolute;left:0;right:0;top:56px;height:12px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}
.ladder .rail i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:6px;background:linear-gradient(90deg,#7c4dff,#ff4f9a,#ffb86b);transition:width 2.4s cubic-bezier(.2,.8,.2,1)}
.ladder .tick{position:absolute;top:50px;width:2px;height:24px;background:rgba(255,255,255,.3)}
.ladder .tick span{position:absolute;top:30px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:700;color:var(--dim);white-space:nowrap}
.ladder .tick.hit span{color:#fff}
.ladder .tick.first span{left:0;transform:none}.ladder .tick.last span{left:auto;right:0;transform:none}
.ladder .mk{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;transition:left 2.4s cubic-bezier(.2,.8,.2,1)}
.ladder .mk img{width:38px;height:38px;border-radius:50%;border:3px solid #fff;background:#333;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.ladder .mk::after{content:"";width:2px;height:12px;background:#fff;margin-top:2px}
.ladder .mk.lead img{border-color:var(--hot);box-shadow:0 0 22px var(--hot)}
.rlist{display:grid;grid-template-columns:1fr 1fr;gap:10px 26px;margin-top:6px}
.rrow{display:grid;grid-template-columns:34px 40px 1fr 70px;align-items:center;gap:12px;background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:8px 16px;
  opacity:0;transform:translateY(16px)}
.scene.on .rrow{opacity:1;transform:none;transition:all .6s cubic-bezier(.2,.8,.2,1)}
.rrow .rk{font-family:var(--disp);font-size:30px;font-weight:800;color:var(--dim)}
.rrow:nth-child(-n+3) .rk{color:var(--pink)}
.rrow img{width:40px;height:40px;border-radius:50%;background:#333}
.rrow .nm{min-width:0}.rrow .nm b{display:block;font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .nm span{font-size:13.5px;color:var(--dim);font-weight:600}
.rrow .nm .bar{height:5px;border-radius:3px;background:rgba(255,255,255,.1);margin-top:6px;overflow:hidden}
.rrow .nm .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7c4dff,#ff4f9a);transition:width 2s .3s cubic-bezier(.2,.8,.2,1)}
.rrow .sc{font-family:var(--disp);font-size:34px;font-weight:800;text-align:right}
.credit{font-size:13px;color:var(--dim);font-weight:700;letter-spacing:.06em}
.ini{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:17px;color:#1a0b24;
  background:linear-gradient(135deg,#ffb86b,#ff4f9a);flex:none}
.ladder .mk .ini{width:38px;height:38px;border:3px solid #fff}
.priv{font-style:normal;font-size:11px;font-weight:800;letter-spacing:.08em;background:rgba(255,184,107,.2);color:#ffb86b;padding:2px 7px;border-radius:5px;vertical-align:2px}
/* challenger */
#chal{padding-top:10px;display:flex;flex-direction:column;gap:18px}
.ch-top{display:flex;gap:10px}
.ch-tag{font-family:var(--disp);font-size:24px;font-weight:800;letter-spacing:.1em;background:#ff2d55;padding:4px 14px;border-radius:8px;animation:chpulse 2s infinite}
.ch-tag.dim{background:rgba(255,255,255,.12);font-size:18px;display:flex;align-items:center;animation:none;text-transform:uppercase}
@keyframes chpulse{50%{box-shadow:0 0 30px rgba(255,45,85,.7)}}
.ch-main{display:flex;align-items:center;gap:28px}
.ch-av .ini,.ch-av img{width:130px;height:130px;font-size:58px;border-radius:50%;border:5px solid #fff;box-shadow:0 0 40px rgba(255,79,154,.6)}
.ch-name{font-family:var(--disp);font-weight:900;font-size:130px;line-height:.85;letter-spacing:-.01em;text-shadow:0 6px 40px rgba(0,0,0,.6)}
.ch-by{font-size:24px;color:var(--soft);font-weight:600;margin-top:10px}
.ch-score{margin-left:auto;text-align:right}
.ch-score b{font-family:var(--disp);font-size:130px;font-weight:900;line-height:.85;text-shadow:0 6px 40px rgba(0,0,0,.6)}
.ch-score small{font-family:var(--disp);font-size:44px;color:var(--dim);font-weight:800}
.ch-score span{display:block;font-size:22px;font-weight:800;color:#fff;margin-top:10px;background:rgba(14,9,26,.75);padding:4px 12px;border-radius:8px;display:table;margin-left:auto}
.ch-gap{font-size:22px;color:var(--soft);font-weight:600}.ch-gap b{font-family:var(--disp);font-size:30px;color:#6ef0a0}
.ch-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.ch-cols>div{background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:18px 22px;display:flex;flex-direction:column;gap:10px}
.ch-cols p{font-size:18px;font-weight:600;line-height:1.35;padding-left:26px;position:relative}
.ch-cols p::before{position:absolute;left:0;top:0;font-weight:900}
.ch-cols p.ok::before{content:"✓";color:#6ef0a0}.ch-cols p.no::before{content:"✕";color:#ff7a8a}

/* headline never runs under the counter */
.headline{max-width:1200px;overflow:hidden;text-overflow:ellipsis}
/* scene title chip */
.scene-chip{position:absolute;left:88px;top:219px;z-index:3;display:flex;align-items:center;gap:8px;height:22px;padding:0 10px 0 8px;border-radius:6px;
  background:rgba(14,9,26,.72);border:1px solid var(--line);font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--soft)}
.scene-chip i{width:6px;height:6px;border-radius:50%;background:var(--pink);box-shadow:0 0 8px var(--pink)}
.scene-chip.go{animation:chipin .6s cubic-bezier(.2,.8,.2,1)}
@keyframes chipin{from{opacity:0;transform:translateX(-24px);clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
/* race moves (port race scene) */
#race{position:absolute}
.race-moves{position:absolute;right:0;top:8px;width:340px;display:flex;flex-direction:column;gap:5px;padding:10px 14px;border-radius:14px;background:rgba(14,9,26,.78);border:1px solid var(--line)}
.race-moves h6{font-size:11px;letter-spacing:.14em;color:var(--dim);font-weight:800}
.race-moves p{font-size:13.5px;font-weight:700;line-height:1.35;display:flex;gap:8px;align-items:center;white-space:nowrap;min-width:0}
.race-moves p span{overflow:hidden;text-overflow:ellipsis}
.race-moves p em{font-style:normal;font-size:10px;font-weight:800;letter-spacing:.08em;padding:2px 6px;border-radius:4px;background:var(--hot);flex:none;margin-top:1px}
.race-moves p em.stage_up{background:#7c4dff}.race-moves p em.new_entry{background:#36b36a}.race-moves p em.exclusive{background:#ffb86b;color:#1a0b24}
/* full-screen race takeover */
#takeover{position:absolute;inset:0;z-index:8;display:none;align-items:center;justify-content:center;pointer-events:none}
#takeover.on{display:flex}
#takeover .to-bg{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(40,14,60,.92),rgba(10,5,20,.97));animation:tofade .5s ease both}
@keyframes tofade{from{opacity:0}}
#takeover .to-in{position:relative;text-align:center;max-width:1500px;padding:0 60px}
#takeover .to-in>*{opacity:0;transform:translateY(40px);animation:toin .7s cubic-bezier(.2,.8,.2,1) forwards}
#takeover .to-name{animation-delay:.12s}#takeover .to-move{animation-delay:.24s}#takeover .to-text{animation-delay:.36s}#takeover .to-src{animation-delay:.5s}
@keyframes toin{to{opacity:1;transform:none}}
.to-kind{display:inline-block;font-family:var(--disp);font-weight:900;font-size:64px;letter-spacing:.18em;padding:6px 34px;border-radius:12px;background:#ff2d55;
  box-shadow:0 0 0 0 rgba(255,45,85,.7)}
#takeover.on .to-kind{animation:toin .7s cubic-bezier(.2,.8,.2,1) forwards, topulse 1.4s .7s ease-out infinite}
@keyframes topulse{0%{box-shadow:0 0 0 0 rgba(255,45,85,.7)}80%{box-shadow:0 0 0 40px rgba(255,45,85,0)}100%{box-shadow:0 0 0 0 rgba(255,45,85,0)}}
.to-kind.stage_up{background:#7c4dff}.to-kind.new_entry{background:#36b36a}.to-kind.exclusive{background:linear-gradient(90deg,#ffb86b,#ff4f9a);color:#1a0b24}
.to-name{font-family:var(--disp);font-weight:900;font-size:190px;line-height:.9;margin-top:26px;text-shadow:0 10px 60px rgba(0,0,0,.5)}
.to-move{font-family:var(--disp);font-weight:800;font-size:64px;margin-top:14px;color:var(--pink)}
.to-move b{color:#fff}
.to-text{font-size:34px;font-weight:700;color:var(--soft);margin-top:20px;line-height:1.3}
.to-src{font-size:15px;font-weight:800;letter-spacing:.16em;color:var(--dim);margin-top:36px}

/* team watch */
#watch{padding-top:10px;display:flex;flex-direction:column;gap:18px}
.w-top{display:flex;align-items:center;gap:18px}
.w-live{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-size:30px;font-weight:800;letter-spacing:.1em;background:linear-gradient(90deg,#ffb86b,#ff4f9a);color:#1a0b24;padding:4px 16px;border-radius:8px}
.w-live i{width:10px;height:10px;border-radius:50%;background:#1a0b24;animation:blink 1.2s infinite}
.w-src{font-size:15px;color:var(--dim);font-weight:700;letter-spacing:.06em}
.w-lead{background:var(--glass);border:1px solid var(--line);border-radius:28px;padding:28px 32px;backdrop-filter:blur(10px)}
.w-meta{display:flex;gap:14px;align-items:center;font-size:16px;color:var(--dim);font-weight:700;letter-spacing:.04em}
.w-badge{font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--hot);color:#fff;padding:4px 10px;border-radius:6px}
.w-badge.sm{font-size:11px;padding:3px 8px;flex:none;background:rgba(255,79,154,.25);color:#ffc2dd}
.w-lead h5{font-size:42px;font-weight:800;line-height:1.12;letter-spacing:-.02em;margin-top:14px}
.w-lead p{font-size:21px;color:var(--soft);line-height:1.42;margin-top:12px;font-weight:500;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.w-list{display:flex;flex-direction:column;gap:10px}
.w-list div{display:flex;align-items:center;gap:14px;background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:12px 18px;opacity:0;transform:translateX(-20px)}
.scene.on .w-list div{opacity:1;transform:none;transition:all .6s cubic-bezier(.2,.8,.2,1)}
.w-list b{font-size:18px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-list s{text-decoration:none;font-size:14px;color:var(--dim);font-weight:700;flex:none}

/* news desk */
#news{padding-top:14px;display:flex;flex-direction:column;gap:18px}
.nlead{background:var(--glass);border:1px solid var(--line);border-radius:28px;padding:30px 34px;backdrop-filter:blur(10px)}
.nlead .cat{display:inline-block;font-size:15px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;background:var(--hot);color:#fff;padding:5px 12px;border-radius:7px}
.nlead .cat.d{background:rgba(255,255,255,.12);margin-left:8px}
.nlead h5{font-size:44px;font-weight:800;line-height:1.1;letter-spacing:-.02em;margin-top:16px}
.nlead p{font-size:22px;color:var(--soft);line-height:1.4;margin-top:14px;font-weight:500;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nmore{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.nmore div{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:16px 20px;opacity:0;transform:translateY(14px)}
.scene.on .nmore div{opacity:1;transform:none;transition:all .6s cubic-bezier(.2,.8,.2,1)}
.nmore b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:18px;font-weight:700;line-height:1.3}
.nmore span{display:block;font-size:13.5px;color:var(--dim);font-weight:700;margin-top:6px;letter-spacing:.04em}

/* elapsed counter (flip clock) */
.clockbox{position:absolute;right:24px;top:-28px;width:auto!important;background:rgba(10,6,20,.82);border:1px solid var(--line);border-radius:24px;padding:14px 22px 12px;width:470px;
  box-shadow:0 20px 60px -20px rgba(255,79,154,.45);backdrop-filter:blur(10px)}
.cb-top{display:flex;align-items:center;gap:12px}
.cb-top .live{display:flex;align-items:center;gap:8px;font-size:14px;padding:5px 10px;animation:none}
.cb-top .live i{width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.4s infinite}
.cb-top .live b{font-weight:700;letter-spacing:.04em}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.8)}70%{box-shadow:0 0 0 9px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.cb-lbl{font-size:14px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--pink);white-space:nowrap}
.cb-digits{display:flex;align-items:flex-start;gap:8px;margin-top:10px}
.cb-unit{display:flex;flex-direction:column;align-items:center;gap:4px}
.cb-unit small{font-size:11px;letter-spacing:.14em;color:var(--dim);font-weight:800;text-transform:uppercase}
.cb-pair{display:flex;gap:4px}
.dg{position:relative;width:44px;height:64px;border-radius:10px;background:linear-gradient(180deg,#2a1d45 0 50%,#231739 50% 100%);overflow:hidden;
  font-family:var(--disp);font-weight:800;font-size:54px;line-height:64px;text-align:center;font-variant-numeric:tabular-nums;box-shadow:inset 0 -2px 0 rgba(0,0,0,.35)}
.dg::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.45)}
.dg span{position:absolute;inset:0}
.dg span.out{animation:dgout .42s cubic-bezier(.5,0,.75,0) forwards}
.dg span.in{animation:dgin .42s cubic-bezier(.25,1,.5,1) forwards}
@keyframes dgout{to{transform:translateY(-70%) scaleY(.6);opacity:0;filter:blur(2px)}}
@keyframes dgin{from{transform:translateY(70%) scaleY(.6);opacity:0;filter:blur(2px)}}
.cb-sep{font-family:var(--disp);font-size:46px;font-weight:800;line-height:64px;color:var(--pink);animation:sep 1s steps(1) infinite}
@keyframes sep{50%{opacity:.25}}
.cb-unit.days .dg{background:linear-gradient(180deg,#ff5fa2 0 50%,#ef4b93 50% 100%);color:#1a0b24}
.cb-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13.5px;color:var(--dim);font-weight:600}
.cb-foot b{color:var(--soft);font-variant-numeric:tabular-nums}
.cb-foot .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#7a6a9a;margin-left:8px;vertical-align:1px}
.cb-foot .dot.ping{background:#5cff9d;animation:ping 1.2s ease-out}
.nextck{margin-left:auto;display:flex;align-items:center;gap:9px;font-family:var(--body);font-size:15px;font-weight:700;color:var(--soft);letter-spacing:0}
.nextck svg{width:20px;height:20px;transform:rotate(-90deg)}
.nextck circle{fill:none;stroke-width:3}
.nextck .t{stroke:rgba(255,255,255,.14)}
.nextck .p{stroke:#5cff9d;stroke-linecap:round;stroke-dasharray:50.27;stroke-dashoffset:0}
.nextck b{color:#fff;font-variant-numeric:tabular-nums;min-width:38px;display:inline-block}
.evsub{font-size:13px;color:var(--dim);font-weight:800;letter-spacing:.12em;margin:-8px 0 8px}
.err{position:absolute;right:30px;top:120px;z-index:5;font-size:14px;color:#ffd166;background:rgba(0,0,0,.7);padding:8px 12px;border-radius:8px;display:none}
.boot{position:absolute;inset:0;z-index:9;display:grid;place-items:center;background:#120a22;font-family:var(--disp);font-size:44px;letter-spacing:.1em;transition:opacity 1s}
</style>
</head>
<body>
<div id="stage">
  <div id="bg"><div class="sky"></div><div class="custom" id="custombg"></div><div class="sun"></div><svg id="city" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMax slice"></svg><div class="floor"></div><div id="slides"></div><div class="grade" id="grade"></div><div id="dust"></div><div class="shade"></div><div class="grain"></div></div>
  <div id="stinger"><i></i><i></i><i></i></div>

  <header>
    <div class="brand" id="brand"></div>
    <div class="repos" id="repos"></div>
    <div class="clockbox" id="clockbox">
      <div class="cb-top"><span class="live"><i></i>LIVE <b class="mono" id="onair">00:00:00</b></span><span class="cb-lbl" id="cblabel">Since the executable dropped</span></div>
      <div class="cb-digits" id="cbdigits"></div>
      <div class="cb-foot"><span id="cbnote"></span><span>checked <b id="checked">--:--:--</b><i class="dot" id="dot"></i></span></div>
    </div>
  </header>
  <div class="headline"><span id="hl"></span><span class="caret"></span></div>
  <div class="scene-chip" id="schip"><i></i><span id="schiptxt">LIVE</span></div>
  <div id="takeover"><div class="to-bg"></div><div class="to-in">
    <div class="to-kind" id="tokind">OVERTAKE</div>
    <div class="to-name" id="toname"></div>
    <div class="to-move" id="tomove"></div>
    <div class="to-text" id="totext"></div>
    <div class="to-src">PORT RACE · LIVE DATA FROM PORTWATCH-VI.XYZ</div>
  </div></div>

  <div id="scenes">
    <section class="scene on" id="spot">
      <div class="breaking" id="breaking">JUST IN</div>
      <div id="spcontent"></div>
      <div class="sp-meter"><i id="spmeter"></i></div>
    </section>
    <section class="scene" id="race"></section>
    <section class="scene" id="chal"></section>
    <section class="scene" id="watch"></section>
    <section class="scene" id="h2h"></section>
    <section class="scene" id="news"></section>
    <section class="scene" id="act"></section>
  </div>
  <div class="scene-dots" id="sdots"></div>

  <aside id="latest"><h4>LATEST <span class="nextck" id="nextck"><svg viewBox="0 0 20 20"><circle class="t" cx="10" cy="10" r="8"/><circle class="p" id="nextring" cx="10" cy="10" r="8"/></svg><span id="nexttxt">next check —</span></span></h4><div class="evsub" id="evcount"></div><div id="evlist"></div></aside>
  <div id="strip"></div>
  <div class="err" id="err"></div>
  <div class="boot" id="boot">
    <div class="boot-img" id="bootimg"></div><div class="boot-shade"></div>
    <div class="boot-brand">PORTING<br>RACE</div>
    <div class="boot-bar"><i id="bootbar"></i></div>
    <div class="boot-load"><span class="spin"></span><span id="bootmsg">Connecting to GitHub…</span></div>
  </div>
  <div id="tips"><span class="spin"></span><span class="tl">LOADING</span><span id="tiptxt"></span></div>
  <div id="slidecredit"></div>
  <div id="np"><div class="eq"><i></i><i></i><i></i><i></i></div><div class="np-t"><small>NOW PLAYING</small><b id="nptitle"></b><span id="npby"></span></div></div>
</div>

<script>
/* ===================== helpers ===================== */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf = n => n == null ? "—" : Number(n).toLocaleString("en-US");
const plural = (n, w) => `${nf(n)} ${w}${n === 1 ? "" : "s"}`;
function ago(iso){ const s = Math.max(0,(Date.now()-new Date(iso))/1000);
  if (s < 45) return "just now"; if (s < 3600) return Math.max(1,Math.round(s/60)) + " min ago";
  if (s < 86400) return Math.floor(s/3600) + " h ago"; return Math.floor(s/86400) + " d ago"; }
function fit(){ const k = Math.min(innerWidth/1920, innerHeight/1080), st = $("#stage");
  st.style.transform = `scale(${k})`; st.style.left = (innerWidth-1920*k)/2 + "px"; st.style.top = (innerHeight-1080*k)/2 + "px"; }
addEventListener("resize", fit); fit();
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rnd = (a, b) => a + Math.random() * (b - a);

/* ===================== background city (generated, original) ===================== */
(function city(){
  const svg = $("#city"); let h = "";
  const layer = (base, minH, maxH, color, winOp, seedW) => {
    let x = -20, out = "";
    while (x < 1940) {
      const w = rnd(seedW, seedW * 2.2), ht = rnd(minH, maxH), y = base - ht;
      out += `<rect x="${x.toFixed(0)}" y="${y.toFixed(0)}" width="${w.toFixed(0)}" height="${ht + 400}" fill="${color}"/>`;
      if (Math.random() < .25) out += `<rect x="${(x + w/2 - 2).toFixed(0)}" y="${(y-28).toFixed(0)}" width="4" height="28" fill="${color}"/>`;
      if (winOp) for (let wy = y + 14; wy < base - 10; wy += 18) for (let wx = x + 8; wx < x + w - 10; wx += 14)

function buildDigits(){
  const units = [["days","days"],["hrs","hours"],["min","min"],["sec","sec"]];

function setPair(unit, str){

  while (box.children.length < str.length) box.insertAdjacentHTML("afterbegin", `<div class="dg"><span>0</span></div>`);

}
function clockTick(){
  const t = now();

  const d = Math.floor(diff / 864e5), h = Math.floor(diff % 864e5 / 36e5), m = Math.floor(diff % 36e5 / 6e4), s = Math.floor(diff % 6e4 / 1e3);
  setPair("days", pad2(d)); setPair("hrs", pad2(h)); setPair("min", pad2(m)); setPair("sec", pad2(s));
  const up = Math.floor((Date.now() - ON_AIR_SINCE) / 1000);
  $("#onair").textContent = `${pad2(Math.floor(up/3600))}:${pad2(Math.floor(up%3600/60))}:${pad2(up%60)}`;
  if (nextPollAt) {

  }
  document.querySelectorAll("[data-at]").forEach(el => el.textContent = ago(el.dataset.at));
}

  if (raceSeen === null) { raceSeen = new Set(list.map(raceKey)); return; }   // first load: baseline only
  for (const e of [...list].reverse()) { const k = raceKey(e); if (!raceSeen.has(k)) { raceSeen.add(k); raceQueue.push(e); } }
  raceQueue = raceQueue.slice(-3);
}
async function showTakeover(e){
  const st = $("#stinger"); st.classList.remove("go"); void st.offsetWidth; st.classList.add("go");
  await sleep(380);
  const k = $("#tokind"); k.className = "to-kind " + (KIND_LBL[e.kind] ? e.kind : ""); k.textContent = KIND_LBL[e.kind] || "RACE UPDATE";
  $("#toname").textContent = e.kind === "exclusive" ? "PortWatch" : e.name;
  $("#tomove").innerHTML = e.kind === "overtake" ? `#${esc(e.from_rank)} <b>→</b> #${esc(e.to_rank)}`
    : e.kind === "stage_up" ? `<b>${esc(e.stage)}</b> · ${esc(e.score)}/100`
    : e.kind === "new_entry" ? `#${esc(e.to_rank)} · ${esc(e.score)}/100 · ${esc(e.stage)}` : "";
  $("#totext").textContent = e.text || "";
  const t = $("#takeover"); t.classList.remove("on"); void t.offsetWidth; t.classList.add("on");
  await sleep(8000);
  st.classList.remove("go"); void st.offsetWidth; st.classList.add("go"); await sleep(380);
  t.classList.remove("on");
}
function raceMovesHtml(){
  const ev = (S?.race_events || []).slice(0, 3);
  if (!ev.length) return "";
  return `<div class="race-moves"><h6>RACE MOVES</h6>${ev.map(e => `<p><em class="${KIND_LBL[e.kind] ? e.kind : ""}">${KIND_LBL[e.kind] || "UPDATE"}</em><span>${esc(e.text)}</span></p>`).join("")}</div>`;
}

/* ---------- team news watch (CGBJ) ---------- */
function renderWatch(){
  const w = S?.watch, el = $("#watch"); if (!w?.items?.length) { el.innerHTML = ""; return; }
  const [lead, ...rest] = w.items;
  const kindLbl = k => ({article: "Article", update: "Tracker update", press: "Press"}[k] || "News");
  const when = at => at ? ago(at) : "";
  el.innerHTML = `
    <div class="w-top"><span class="w-live"><i></i>${esc(w.name)} WATCH</span><span class="w-src">Sources: ${w.sources.map(esc).join(" · ")}</span></div>
    <div class="w-lead">
      <div class="w-meta"><span class="w-badge">${esc(lead.source)}</span><span>${kindLbl(lead.kind)}</span><span data-at="${esc(lead.at)}">${when(lead.at)}</span></div>
      <h5>${esc(lead.title)}</h5>
      ${lead.dek || lead.detail ? `<p>${esc(lead.dek || lead.detail)}</p>` : ""}
    </div>
    <div class="w-list">${rest.slice(0, 4).map((it, i) => `<div style="transition-delay:${150 + i * 90}ms">
      <span class="w-badge sm">${esc(it.source)}</span><b>${esc(it.title)}</b><s data-at="${esc(it.at)}">${when(it.at)}</s></div>`).join("")}</div>
    <div class="credit">AUTO-UPDATES EVERY 10 MIN · checked <span data-at="${esc(w.checked_at)}">${ago(w.checked_at)}</span> · only items that name ${esc(w.name)} are shown</div>`;
}
function animateRace(){
  const pw = PW(); if (!pw?.leader) return;
  setTimeout(() => {
    document.querySelectorAll("#race [data-w]").forEach(i => i.style.width = i.dataset.w + "%");
    document.querySelectorAll("#race .mk").forEach(m => m.style.left = m.dataset.l + "%");
    const el = $("#raceNum"), to = pw.leader.score, t0 = performance.now();
    (function step(t){ const p = Math.min(1, (t - t0) / 2200), e = 1 - Math.pow(1 - p, 4);
      el.textContent = (to * e).toFixed(1).replace(/\.0$/, ""); if (p < 1) requestAnimationFrame(step); })(t0);
  }, 120);
}
function renderNews(){
  const pw = PW(); const el = $("#news");
  if (!pw || !pw.news?.length) { el.innerHTML = `<div class="sub">Waiting for portwatch-vi.xyz…</div>`; return; }
  const [lead, ...rest] = pw.news, heads = pw.headlines || [];
  const more = [...rest.slice(0, 2).map(n => ({t: n.title, s: `${n.category} · ${n.date}`})), ...heads.slice(0, 2).map(h => ({t: h.title, s: `${h.outlet} · ${ago(h.date)}`}))];
  el.innerHTML = `
    <div class="nlead"><span class="cat">${esc(lead.category || "News")}</span><span class="cat d">${esc(lead.date)}</span>
      <h5>${esc(lead.title)}</h5><p>${esc(lead.dek)}</p></div>
    <div class="nmore">${more.map((m, i) => `<div style="transition-delay:${150 + i * 90}ms"><b>${esc(m.t)}</b><span>${esc(m.s)}</span></div>`).join("")}</div>
    <div class="credit">NEWS DESK · PORTWATCH-VI.XYZ</div>`;
}

/* ===================== activity ===================== */
function renderAct(){
  const mx = Math.max(1, ...R.flatMap(r => r.commits_by_hour || []));
  let cols = ""; for (let h = 0; h < 24; h++) cols += `<div class="h">${R.map(r => `<i style="background:${r.accent}" data-h="${((r.commits_by_hour||[])[h]||0)/mx*100}"></i>`).join("")}</div>`;
  const leaders = R.flatMap(r => (r.leaders||[]).map(l => ({...l, r}))).sort((a,b) => b.n - a.n).slice(0, 7);
  $("#act").innerHTML = `
    <div class="card"><div class="sub">Commits per hour · last 24h</div>
      <div class="leg">${R.map(r => `<span><i style="background:${r.accent}"></i>${esc(r.label)} · ${nf(r.commits_24h)}${r.commits_capped?"+":""}</span>`).join("")}</div>
      <div class="chart">${cols}</div><div class="axis"><span>24h ago</span><span>12h ago</span><span>now</span></div></div>
    <div class="card"><div class="sub">Top committers · 24h</div><div class="lb">${leaders.map((l, i) => `
      <div class="r" style="transition-delay:${i*90}ms"><span class="rk">${i+1}</span><img src="${esc(l.avatar||"")}&s=80" alt="">${esc(l.login)} <span class="tag" style="background:${l.r.accent}">${esc(l.r.label)}</span><span class="n">${l.n}</span></div>`).join("")}</div></div>`;
}
function animateAct(){ document.querySelectorAll("#act .chart i").forEach(i => { i.style.height = 0; void i.offsetWidth; i.style.height = i.dataset.h + "%"; }); }

/* ===================== latest feed ===================== */
function renderLatest(fresh){
  const list = buildQueue().slice(0, 5), el = $("#evlist");
  el.innerHTML = list.map(e => {
    const kind = e.draft && e.kind === "opened" ? "draft" : e.kind, k = evKey(e), isNew = fresh.has(k);
    return `<div class="ev ${isNew ? "enter fresh" : ""}" data-k="${esc(k)}"><span class="pill ${kind}">${kind[0].toUpperCase()+kind.slice(1)}</span>
      <div><p>#${e.n} ${esc(e.title)}</p><s><span class="badge" style="background:${e.r.accent}">${esc(e.r.label)}</span>${esc(e.by)}, <span data-at="${esc(e.at)}">${ago(e.at)}</span></s></div></div>`;
  }).join("");
  const today = R.reduce((a, r) => a + (r.merged_today || 0), 0);
  $("#evcount").textContent = `${nf(today)} PRS MERGED TODAY · BOTH REPOS`;
}

/* ===================== stat strip (flips between repos) ===================== */
let stripRepo = 0;
function tileFaces(r){
  const rel = r.release ? (r.release.tag || r.release.name) : "None yet";
  return [
    [nf(r.open_prs), "Open pull requests"], [nf(r.merged_today), "Merged today"], [nf(r.total_prs), "Pull requests so far"],
    [nf(r.stars), "Stars"], [rel, "Latest release"]];
}
function renderStrip(flip){
  if (!R.length) return;
  const strip = $("#strip");
  if (!strip.children.length) strip.innerHTML = Array.from({length:5}, () => `<div class="tile"><div class="face front"></div><div class="face back"></div></div>`).join("");
  const r = R[stripRepo % R.length], faces = tileFaces(r);
  [...strip.children].forEach((t, i) => {
    const flipped = t.classList.contains("flip"), target = flip ? (flipped ? $(".front", t) : $(".back", t)) : (flipped ? $(".back", t) : $(".front", t));
    target.style.setProperty("--acc", r.accent);
    target.innerHTML = `<b>${esc(faces[i][0])}</b><span>${faces[i][1]} <span class="badge" style="background:${r.accent}">${esc(r.label)}</span></span>`;
    if (flip) setTimeout(() => t.classList.toggle("flip"), i * 110);
  });
}
setInterval(() => { if (R.length > 1) { stripRepo++; renderStrip(true); } }, 12000);

/* ===================== scene director ===================== */
const SCENES = [{id:"spot", dur:42000}, {id:"race", dur:18000}, {id:"chal", dur:15000}, {id:"watch", dur:15000}, {id:"h2h", dur:15000}, {id:"news", dur:15000}, {id:"act", dur:14000}];
$("#sdots").innerHTML = SCENES.map(() => "<div><i></i></div>").join("");
let sceneIdx = 0;
function setScene(i){
  if (typeof sceneIdx !== "undefined" && i !== sceneIdx) nextSlide(true);
  sceneIdx = i; SCENES.forEach((s, k) => $("#" + s.id).classList.toggle("on", k === i));
  const CHIP = {spot: "PR SPOTLIGHT", race: "PORT RACE", chal: "CHALLENGER", watch: `${(S?.watch?.name || "TEAM").toUpperCase()} WATCH`, h2h: "HEAD TO HEAD", news: "NEWS DESK", act: "ACTIVITY"};
  $("#schiptxt").textContent = CHIP[SCENES[i].id] || "LIVE"; const chip = $("#schip"); chip.classList.remove("go"); void chip.offsetWidth; chip.classList.add("go");
  document.querySelectorAll("#sdots i").forEach((d, k) => { d.style.transition = "none"; d.style.width = k < i ? "100%" : "0"; });
  const cur = document.querySelectorAll("#sdots i")[i]; void cur.offsetWidth; cur.style.transition = `width ${SCENES[i].dur}ms linear`; cur.style.width = "100%";
  const allOn = () => { focusRepo(null); document.querySelectorAll("#brand span").forEach(s => s.classList.add("on")); };
  if (SCENES[i].id === "race") { renderRace(); animateRace(); allOn(); }
  if (SCENES[i].id === "news") { renderNews(); allOn(); }
  if (SCENES[i].id === "chal") { renderChal(); allOn(); }
  if (SCENES[i].id === "watch") { renderWatch(); allOn(); }
  if (SCENES[i].id === "h2h") { renderH2H(); setTimeout(animateH2H, 80); focusRepo(null); document.querySelectorAll("#brand span").forEach(s => s.classList.add("on")); }
  if (SCENES[i].id === "act") { renderAct(); setTimeout(animateAct, 80); focusRepo(null); document.querySelectorAll("#brand span").forEach(s => s.classList.add("on")); }
}
async function waitOrRace(ms){ const end = Date.now() + ms; while (Date.now() < end && !raceQueue.length) await sleep(200); }
async function director(){
  while (!R.length) await sleep(300);
  while (true) {
    setScene(0);
    const end = Date.now() + SCENES[0].dur;
    while (Date.now() < end) {
      if (raceQueue.length) { await showTakeover(raceQueue.shift()); continue; }
      if (breakingQueue.length) { await showSpot(breakingQueue.shift(), true); await waitOrRace(7000); continue; }
      queue = buildQueue(); if (!queue.length) { await sleep(1000); continue; }
      await showSpot(queue[spIdx++ % queue.length], false); await waitOrRace(7000);
    }
    for (let k = 1; k < SCENES.length; k++) {
      if (SCENES[k].id === "chal" && !challenger()) continue;
      if (SCENES[k].id === "watch" && !(S?.watch?.items?.length)) continue;
      setScene(k); const t = Date.now() + SCENES[k].dur;
      while (Date.now() < t) { if (breakingQueue.length || raceQueue.length) break; await sleep(250); }
      if (raceQueue.length) { while (raceQueue.length) await showTakeover(raceQueue.shift()); setScene(k); }
      if (breakingQueue.length) break;
    }
  }
}
director();

/* ===================== data loop ===================== */
async function tick(){
  try {
    const s = await (await fetch("/api/state", {cache:"no-store"})).json();
    $("#err").style.display = s.error ? "block" : "none"; $("#err").textContent = s.error ? "⚠ " + s.error : "";
    const repos = s.order.map(x => s.repos[x]).filter(Boolean);
    if (!repos.length) return;
    serverSkew = Date.parse(s.server_time) - Date.now();
    if (s.build) { if (window.BUILD && s.build !== window.BUILD) { location.reload(); return; } window.BUILD = s.build; }
    setSlides(s.slides); MUSIC = s.music; trackRaceEvents(s.race_events);
    if (s.counter) { COUNTER_START = Date.parse(s.counter.start); $("#cblabel").textContent = s.counter.label; $("#cbnote").textContent = "since " + s.counter.note; }
    nextPollAt = s.next_poll_at ? Date.parse(s.next_poll_at) : null; pollEvery = s.poll_seconds || 30;
    const changed = !S || s.updated_at !== S.updated_at; S = s; R = repos;
    if (!changed) return;
    if (firstLoad) { if (s.slides?.length) $("#bootimg").style.backgroundImage = `url("${s.slides[0].src}")`; $("#bootmsg").textContent = "Loading live stats…"; setTimeout(bootDone, 3200); nextTip(); }
    const repoKey = R.map(r => r.slug).join();
    if (repoKey !== tick.repoKey) { tick.repoKey = repoKey; renderHeader(); }
    const fresh = new Set();
    for (const e of buildQueue()) { const k = evKey(e); if (!seenEvents.has(k)) { if (!firstLoad) { fresh.add(k); breakingQueue.push(e); } seenEvents.add(k); } }
    breakingQueue = breakingQueue.slice(-4);
    const wTop = s.watch?.items?.[0]?.title;
    if (wTop && tick.wTop && wTop !== tick.wTop) { const b = $("#breaking"); b.textContent = `${s.watch.name} NEWS`; b.classList.remove("go"); void b.offsetWidth; b.classList.add("go"); setTimeout(() => b.textContent = "JUST IN", 4200); }
    if (wTop) tick.wTop = wTop;
    renderLatest(fresh); renderStrip(false);
    if (SCENES[sceneIdx].id === "h2h") renderH2H(), animateH2H();
    if (s.updated_at) $("#checked").textContent = new Date(s.updated_at).toLocaleTimeString("en-GB");
    const d = $("#dot"); d.classList.remove("ping"); void d.offsetWidth; d.classList.add("ping");
    firstLoad = false;
  } catch (e) { $("#err").style.display = "block"; $("#err").textContent = "⚠ dashboard server unreachable"; }
}
tick(); setInterval(tick, 10000);
